<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>Trailer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body><script>
(function () {
  var m = location.search.match(/[?&]v=([\w-]{11})/); if (!m) return;
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
  f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen'); f.setAttribute('allowfullscreen', '');
  f.onload = function () { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {} };
  document.body.appendChild(f);
  window.addEventListener('message', function (e) { if (e.source === f.contentWindow && window.parent !== window) window.parent.postMessage(e.data, '*'); });
})();
</script></body></html>
